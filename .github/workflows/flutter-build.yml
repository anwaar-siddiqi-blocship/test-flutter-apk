name: Flutter Build & Artifact Link

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: flutter-apk
        path: build/app/outputs/flutter-apk/app-release.apk

    - name: Send Artifact Link via Email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.mailtrap.io
        server_port: 587
        username: ${{ secrets.MAILTRAP_USER }}
        password: ${{ secrets.MAILTRAP_PASS }}
        subject: "Flutter APK Build"
        body: |
          Hello! New APK build is ready.  
          Download artifact: ${{ github.server_url }}/${{ github.repository }}/suites/${{ github.run_id }}/artifacts
        to: "anwaar.siddiqi@blocship.io"
        from: "build@myapp.com"
